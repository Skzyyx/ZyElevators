name: Release

# Push a tag like v1.0.1 to build the jar and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check that the tag matches the pom.xml version
        run: |
          VERSION=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::pom.xml has version $VERSION but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build
        run: mvn -B -ntp package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/ZyElevators-*.jar \
            --title "ZyElevators ${GITHUB_REF_NAME#v}" \
            --generate-notes
